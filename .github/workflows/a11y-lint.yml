env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

name: Accessibility Lint
on: [pull_request]

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Enable unprivileged user namespaces for Chromium
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Run Axe Scan
        run: |
          # Start the server and scan the 'dist' folder
          npx axe-core-helper ./dist --serve || true
